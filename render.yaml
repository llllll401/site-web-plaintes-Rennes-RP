services:
  - type: web
    name: rennes-rp-signalements
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/session
    disk:
      name: preuves
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: STAFF_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
